  # GitHub's own private advisory form, NOT a mailto:. stoatworks-labs.com publishes no
  # MX record, so every @stoatworks-labs.com address bounces — a security contact that
  # silently discards reports is worse than having none, because the reporter believes
  # they have disclosed responsibly and starts their clock. This form needs no mail
  # infrastructure and is private by construction.
  - name: Report a security vulnerability privately
    url: https://github.com/stoatworks-labs/simplecue/security/advisories/new
    about: >
      Please don't open a public issue for a vulnerability. This form is private and
      goes straight to the maintainer.
